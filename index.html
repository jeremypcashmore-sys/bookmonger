<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14212a"><title>Bookmonger — Feed your curiosity</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9edf0;background:#101b23}*{box-sizing:border-box}body{margin:0}header{padding:24px max(22px,calc((100vw - 1150px)/2));background:#172630;border-bottom:1px solid #30414b}.brand{font-family:Georgia,serif;font-size:32px;font-weight:bold;color:#f0d09a}.tag{color:#b7c2c8;font-size:13px}main{max-width:1150px;margin:auto;padding:26px 22px 80px}.hero{padding:30px;background:linear-gradient(110deg,#283e48,#16252e);border-radius:18px;margin-bottom:26px}h1{font-family:Georgia,serif;font-size:clamp(29px,5vw,48px);margin:0 0 10px}h2{font-family:Georgia,serif;margin:28px 0 14px}p{line-height:1.7;color:#c9d2d7}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #50616a;background:#1e303a;color:white}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:#e5bc7c}.active,.gold{background:#dcb57a;color:#17232b;border-color:#dcb57a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}.book{background:#1a2a34;border:1px solid #32444e;border-radius:13px;overflow:hidden;cursor:pointer}.cover{height:225px;display:flex;align-items:center;justify-content:center;padding:17px;text-align:center;background:linear-gradient(145deg,var(--a),var(--b));position:relative}.cover:before{content:'';position:absolute;inset:9px;border:1px solid #ffffff55}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.cover:has(img:not([hidden])):before{display:none}.cover-title{font-family:Georgia,serif;font-size:23px;line-height:1.15;font-weight:bold;z-index:1;text-shadow:0 1px 2px #0005}.cover-author{position:absolute;bottom:22px;left:14px;right:14px;font-size:12px;z-index:1}.meta{padding:13px}.meta strong{display:block;min-height:42px}.small{font-size:12px;color:#b6c4cb}.pill{display:inline-block;background:#344752;padding:5px 9px;border-radius:15px;font-size:12px;margin:4px 4px 4px 0}.panel{background:#1b2b35;border:1px solid #344651;border-radius:16px;padding:25px;margin:20px 0}.back{margin-bottom:15px}.map{width:100%;max-height:460px;object-fit:contain;background:#e6e4da;border-radius:10px}.mapbox{margin:24px 0}.hidden{display:none}a{color:#e8c38b}.empty{padding:30px;color:#b7c5ce}.section{border-top:1px solid #3b4b55;padding-top:8px;margin-top:22px}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{height:200px}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.cover:has(img:not([hidden])):before{display:none}.cover-title{font-size:20px}.panel{padding:16px}}
/* Bookmonger reading room — Apple Books inspired */
#detail{background:#fff;color:#151515;min-height:85vh;border-radius:8px;padding:clamp(20px,5vw,64px);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
#detail .panel{background:#fff;color:#151515;border:0;border-radius:0;padding:0;margin:0 auto 24px;max-width:900px}
#detail h1,#detail h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111;letter-spacing:-.02em}
#detail h1{font-size:clamp(30px,4vw,45px)}
#detail h2{font-size:clamp(23px,3vw,31px)}
#detail p,#detail li{font-size:var(--reader-font,24px);line-height:1.75;color:#171717}
#detail .small,#detail .pill{color:#555;font-size:14px}
#detail .pill{background:#f0f0f0}
#detail .controls button,#detail .back,#detail .reader-tools button{background:#f3f3f3;color:#111;border:1px solid #ccc}
#detail a{color:#165b8c}
#detail .mapbox{background:#f8f8f8;color:#111}
.reader-tools{position:sticky;top:0;z-index:10;display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ddd;padding:12px 0;margin:0 auto 25px;max-width:900px}
.reader-tools button{padding:8px 13px}
.reader-progress{font-size:14px;color:#555}
@media(max-width:650px){#detail{padding:18px}#detail p,#detail li{line-height:1.65}}
</style></head><body><header><div class="brand">Bookmonger</div><div class="tag">Feed your curiosity. · Your personal reading library</div></header><main><div id="home"><div class="hero"><h1>Discover something worth reading.</h1><p>Beautiful books. Original 15-minute reading guides. History, ideas and a world worth exploring.</p><button class="gold" onclick="surprise()">✦ Surprise me</button></div><div class="controls"><input id="search" placeholder="Search books, authors, subjects…" oninput="render()"><select id="category" onchange="render()"><option value="All">All subjects</option><option>History</option><option>Psychology</option><option>Philosophy</option><option>Business</option><option>Health</option><option>Biography</option></select><select id="statusFilter" onchange="render()"><option value="All">All books</option><option value="Saved">Want to read</option><option value="Reading">Reading</option><option value="Completed">Completed</option></select></div><h2>This week's discoveries</h2><div id="books" class="grid"></div></div><div id="detail" class="hidden"></div></main><script>
const books=[
{id:'ottoman',title:"Osman's Dream",author:'Caroline Finkel',cat:'History',a:'#6b392a',b:'#bd8452',desc:'The rise, transformation and fall of the Ottoman Empire, from its Anatolian beginnings to 1922.',featured:true},
{id:'1453',title:'1453',author:'Roger Crowley',cat:'History',a:'#394b52',b:'#9c7046',desc:'The siege of Constantinople and a turning point in world history.'},
{id:'ottomans',title:'The Ottomans',author:'Marc David Baer',cat:'History',a:'#293e57',b:'#867e6b',desc:'How Ottoman rulers shaped the histories of Europe, Asia and the Mediterranean.'},
{id:'examined',title:'The Examined Life',author:'Stephen Grosz',cat:'Psychology',a:'#785c4b',b:'#c3a27d',desc:'Stories from the consulting room about the hidden patterns of human life.'},
{id:'thinking',title:'Thinking, Fast and Slow',author:'Daniel Kahneman',cat:'Psychology',a:'#283f57',b:'#6496a6',desc:'A tour of the mental shortcuts and biases that shape our judgments.'},
{id:'weeks',title:'Four Thousand Weeks',author:'Oliver Burkeman',cat:'Philosophy',a:'#3b5262',b:'#b99c72',desc:'A fresh approach to time, priorities and the limits of productivity.'},
{id:'outlive',title:'Outlive',author:'Peter Attia',cat:'Health',a:'#40534a',b:'#a1ae83',desc:'Thinking more deliberately about healthspan and longevity.'},
{id:'good',title:'Good to Great',author:'Jim Collins',cat:'Business',a:'#642e30',b:'#c27d6a',desc:'What distinguishes sustained business performance from the ordinary.'},
{id:'mans',title:"Man's Search for Meaning",author:'Viktor E. Frankl',cat:'Biography',a:'#3f465c',b:'#8b95b5',desc:'Meaning and resilience through the experience of a psychiatrist and survivor.'},
{id:'solitude',title:'The Stranger in the Woods',author:'Michael Finkel',cat:'Biography',a:'#29483f',b:'#658c71',desc:'A remarkable true story of solitude in the Maine wilderness.'}
];
const key='bookmonger-progress-v1';let progress={};try{progress=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const save=()=>localStorage.setItem(key,JSON.stringify(progress));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value,s=document.getElementById('statusFilter').value;let filtered=books.filter(b=>(b.title+' '+b.author+' '+b.cat+' '+b.desc).toLowerCase().includes(q)&&(c==='All'||b.cat===c)&&(s==='All'||(progress[b.id]||'')===s));document.getElementById('books').innerHTML=filtered.length?filtered.map(b=>`<article class="book" onclick="openBook('${b.id}')"><div class="cover" style="--a:${b.a};--b:${b.b}"><img id="cover-${b.id}" alt="Cover of ${esc(b.title)}" loading="lazy" hidden><div class="cover-title">${esc(b.title)}</div><div class="cover-author">${esc(b.author)}</div></div><div class="meta"><strong>${esc(b.title)}</strong><div class="small">${esc(b.cat)} · ${esc(progress[b.id]||'Not started')}</div></div></article>`).join(''):'<div class="empty">No matching books.</div>';loadDirectCovers(filtered)}

// Direct edition-cover links, no search service required. Unavailable images retain placeholders.
const directISBN={thinking:'9780374533557',weeks:'9780374159122',outlive:'9780593236598',mans:'9780807014271',good:'9780066620992',examined:'9780393349320',solitude:'9781101875681',ottoman:'9780465023967','1453':'9781401308506',ottomans:'9781541673793'};
function loadDirectCovers(items){items.forEach(b=>{const img=document.getElementById('cover-'+b.id);if(!img)return;const isbn=directISBN[b.id];if(!isbn)return;img.onload=()=>{img.hidden=false};img.onerror=()=>{img.hidden=true};img.src='https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg?default=false';});}

// Fetch matching real book covers from Open Library; keep our designed placeholders if unavailable.
const coverCache = {};
async function loadCovers(items) {
  await Promise.all(items.map(async b => {
    const img = document.getElementById('cover-' + b.id);
    if (!img) return;
    if (coverCache[b.id] === null) return;
    if (!coverCache[b.id]) {
      try {
        const url = 'https://openlibrary.org/search.json?' +
          new URLSearchParams({title:b.title,author:b.author,limit:'8',fields:'title,author_name,cover_i'});
        const response = await fetch(url);
        if (!response.ok) throw Error('Cover search unavailable');
        const data = await response.json();
        const match = (data.docs || []).find(d => d.cover_i &&
          (d.author_name || []).some(a => a.toLowerCase().includes(b.author.split(' ').slice(-1)[0].toLowerCase())));
        coverCache[b.id] = match ? 'https://covers.openlibrary.org/b/id/' + match.cover_i + '-L.jpg' : null;
      } catch(e) { coverCache[b.id] = null; }
    }
    if (!coverCache[b.id]) return;
    const current = document.getElementById('cover-' + b.id);
    if (!current) return;
    current.onload = () => { current.hidden = false; };
    current.onerror = () => { current.hidden = true; };
    current.src = coverCache[b.id];
  }));
}

function surprise(){openBook(books[Math.floor(Math.random()*books.length)].id)}
function setStatus(id,v){progress[id]=v;save();openBook(id)}
function openBook(id){let b=books.find(x=>x.id===id);document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');let article=id==='ottoman'?ottomanGuide:generalGuide(b);document.getElementById('detail').innerHTML=`<div class="reader-tools"><button onclick="back()">← Library</button><span>Reading view</span><div><button onclick="readerSize(-2)" aria-label="Smaller text">A−</button> <button onclick="readerSize(2)" aria-label="Larger text">A+</button></div><span class="reader-progress" id="readerProgress">0%</span></div><div class="panel"><span class="pill">${esc(b.cat)}</span><span class="pill">15-minute reading guide</span><h1>${esc(b.title)}</h1><p><b>${esc(b.author)}</b></p><p>${esc(b.desc)}</p><div class="controls"><button onclick="setStatus('${id}','Saved')">☆ Want to read</button><button onclick="setStatus('${id}','Reading')">◉ Reading</button><button onclick="setStatus('${id}','Completed')">✓ Completed</button></div><div class="small">Your status: ${esc(progress[id]||'Not started')} · Saved on this device</div></div>${article}`;window.scrollTo(0,0);readerSize(0);updateReaderProgress()}
let readerFont=Number(localStorage.getItem('bookmonger-reader-font')||24);
function readerSize(delta){readerFont=Math.max(18,Math.min(36,readerFont+delta));localStorage.setItem('bookmonger-reader-font',readerFont);document.getElementById('detail').style.setProperty('--reader-font',readerFont+'px')}
function updateReaderProgress(){const el=document.getElementById('readerProgress');if(!el||document.getElementById('detail').classList.contains('hidden'))return;const max=document.documentElement.scrollHeight-innerHeight;el.textContent=(max>0?Math.round(100*scrollY/max):100)+'%'}
window.addEventListener('scroll',updateReaderProgress,{passive:true});
function back(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');render();window.scrollTo(0,0)}
const ottomanGuide=`<div class="panel"><h2>The Ottoman Empire: a concise illustrated introduction</h2><p><em>An original introductory guide inspired by the historical subject of Osman's Dream — not a reproduction or chapter-by-chapter summary of Caroline Finkel's book.</em></p><div class="section"><h2>1 · From frontier principality to empire</h2><p>Around the turn of the fourteenth century, Osman I led a small Turkish principality in northwestern Anatolia, near the borders of the weakened Byzantine Empire. His successors expanded through alliances, warfare and administration. By the late fourteenth century Ottoman rulers held territories in both Anatolia and the Balkans.</p><p>The empire did not rise in a single leap. It grew through military organization, strategic marriages, diplomacy, control of trade routes and an ability to govern diverse populations.</p></div><div class="section"><h2>2 · Constantinople, 1453</h2><p>Mehmed II captured Constantinople in 1453, bringing the Byzantine Empire to an end. The city became the Ottoman capital and a major centre of government, commerce, scholarship and religion. Its location on the Bosporus gave the empire strategic access between the Black Sea and the Mediterranean.</p><p>The conquest is a useful historical turning point, but the Ottomans already ruled a large and varied territory before 1453.</p></div><div class="mapbox"><h2>Historical map · The empire in 1683</h2><img class="map" loading="lazy" src="https://commons.wikimedia.org/wiki/Special:FilePath/OttomanEmpire1683.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" alt="Historical map of Ottoman territory in 1683"><div style="display:none"><p>Map preview unavailable. <a target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/Category:Maps_of_the_Ottoman_Empire">Browse Ottoman Empire maps on Wikimedia Commons ↗</a></p></div><p class="small">Historical map reference. For reliable borders and dates, consult the map's source and legend. <a target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/Category:Maps_of_the_Ottoman_Empire">More maps ↗</a></p></div><div class="section"><h2>3 · Suleiman and imperial power</h2><p>During the sixteenth century, particularly under Suleiman I (reigned 1520–1566), the Ottoman state exercised influence across southeastern Europe, the eastern Mediterranean, the Middle East and North Africa. Its military power was formidable, but the empire also depended on taxation, provincial officials, law, diplomacy and long-distance trade.</p><p>Ottoman society was religiously and linguistically diverse. Muslims, Christians and Jews lived within the empire under changing arrangements of law, community autonomy and unequal status. Their experiences varied widely across centuries and provinces.</p></div><div class="section"><h2>4 · An empire in transformation</h2><p>It is misleading to describe every century after Suleiman simply as decline. Ottoman institutions adapted to changing military technologies, economic pressures, provincial power and competition with European states. Reformers in the nineteenth century attempted to modernize administration, the army and legal structures.</p><p>Territorial losses, nationalism, financial pressures and international conflict nevertheless weakened the imperial state. The Balkan Wars of 1912–13 sharply reduced its European territories.</p></div><div class="section"><h2>5 · The First World War and the end</h2><p>The Ottoman Empire entered the First World War on the side of the Central Powers. War, displacement and mass violence devastated populations. The Armenian genocide of 1915–16 was a central atrocity of this period. Following defeat, the empire was occupied and partition plans were contested by the Turkish nationalist movement.</p><p>The Ottoman sultanate was abolished in 1922; the Republic of Türkiye was proclaimed in 1923. The empire's legacy survives in languages, architecture, religious institutions, borders and political memories across a vast region.</p></div><div class="section"><h2>Five ideas to remember</h2><ol><li>Ottoman power grew from a small Anatolian frontier state.</li><li>The conquest of Constantinople in 1453 transformed the empire's capital and prestige.</li><li>Military strength mattered, but administration and diplomacy sustained the state.</li><li>The empire was diverse and changed substantially over six centuries.</li><li>Its dissolution reshaped southeastern Europe and the modern Middle East.</li></ol><h2>Test your understanding</h2><p>Why was Constantinople strategically important? What enabled the Ottomans to govern diverse populations? Why is the simple idea of a centuries-long decline inadequate?</p></div><p class="small">Further exploration: <a target="_blank" rel="noopener" href="https://www.metmuseum.org/toah/hd/otto1/hd_otto1.htm">Metropolitan Museum Ottoman art and history ↗</a> · <a target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/Category:Maps_of_the_Ottoman_Empire">Historical maps ↗</a></p></div>`;
function generalGuide(b){return `<div class="panel"><h2>Reading guide coming next</h2><p>${esc(b.title)} is in your discovery library. We can add an original, carefully researched 15-minute written guide here next, with key ideas, illustrations and questions for reflection.</p><p>In the meantime, save this title to your reading list.</p></div>`}render();
</script></body></html>
